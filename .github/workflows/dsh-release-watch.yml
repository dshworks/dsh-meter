# A new dsh release should turn this repo red, not quietly uninstall it.
#
# The check installs the plugin the way users do -- `dsh plugin --profile web
# add <spec>` on a scratch dsh -- and asserts two things (see
# scripts/check-dsh-release.mjs for the reasoning and the source it cites):
#
# - it installs at all. From dsh 0.1.7, `dsh plugin add` refuses a plugin whose
#   `@deepseek-ai/dsh-*` peer range does not admit the running dsh, so the day
#   `latest` moves to a line our range does not name, users cannot install us.
# - the profile holds nothing dsh already supplies. `dependencies` are hoisted
#   into the profile and shadow the host's copy for every plugin in it.
#
# It reads npm, so it fails loudly rather than silently: a red scheduled run
# notifies nobody, and an issue does.
name: dsh-release-watch

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:
  pull_request:
    paths: ['package.json', 'scripts/check-dsh-release.mjs', '.github/workflows/dsh-release-watch.yml']

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    # Two scratch dsh installs (`latest` and the version ahead of it) dominate.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # `dsh plugin` runs pnpm; packing this tree needs no install.
      - run: npm install --global pnpm

      # `--tree-only` on a pull request: the published package is still the
      # broken one on the very PR that fixes it, so gating a PR on it would
      # make this check red on its own fix. The scheduled run owns that half —
      # it is also the only run that can ever see it clear.
      - id: check
        run: |
          set +e
          node scripts/check-dsh-release.mjs ${{ github.event_name == 'pull_request' && '--tree-only' || '' }} > report.md
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat report.md
          set -e

      # A pull request wants the answer in its own checks, not in an issue.
      - if: github.event_name == 'pull_request' && steps.check.outputs.status != '0'
        run: exit 1

      - if: github.event_name != 'pull_request' && steps.check.outputs.status != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            if [ "${{ steps.check.outputs.status }}" = "2" ]; then
              echo "The daily dsh release check could not finish."
            else
              echo "This plugin no longer installs cleanly on the dsh users get."
              echo
              echo "- \`dsh plugin add\` refused it: a \`@deepseek-ai/dsh-*\` peer range in \`package.json\`"
              echo "  no longer admits the running dsh. Prove the plugin works on the new line"
              echo "  (install it, render the surface), then OR that line into the range."
              echo "- The profile carries a copy of a package dsh supplies: move it from"
              echo "  \`dependencies\` to \`peerDependencies\` (and \`devDependencies\` for tests)."
              echo
              echo "Then re-run \`node scripts/check-dsh-release.mjs\` and publish: a fix on main that"
              echo "never reaches npm leaves every user broken."
            fi
            echo
            cat report.md
          } > issue.md
          # `gh issue list --label` errors on a label that does not exist yet,
          # which would swallow the very first alert.
          gh label create dsh-release --color B60205 --force \
            --description "A dsh release moved out from under this plugin"
          open=$(gh issue list --label dsh-release --state open --limit 1 --json number --jq '.[0].number')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file issue.md
          else
            gh issue create --title "A dsh release moved out from under this plugin" --label dsh-release --body-file issue.md
          fi
